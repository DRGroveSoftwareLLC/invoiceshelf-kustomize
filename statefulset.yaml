apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: invoiceshelf
  labels:
    app.kubernetes.io/name: invoiceshelf
    app.kubernetes.io/component: server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: invoiceshelf
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: invoiceshelf
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: invoiceshelf
          image: invoiceshelf/invoiceshelf
          env:
            - name: LOG_CHANNEL
              value: stderr
            - name: TRUSTED_PROXY
              value: local
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
          startupProbe:
            initialDelaySeconds: 20
            periodSeconds: 5
            # Migrations run on start
            failureThreshold: 60
            httpGet:
              path: /api/v1/app/version
              port: http
          livenessProbe:
            periodSeconds: 5
            httpGet:
              path: /api/v1/app/version
              port: http
          readinessProbe:
            periodSeconds: 5
            httpGet:
              path: /api/v1/app/version
              port: http
          volumeMounts:
            - name: invoiceshelf-data
              mountPath: /var/www/html/storage
              subPath: data
            - name: dot-env
              mountPath: /var/www/html/.env
              subPath: env
      securityContext:
        # www-data in the serversideup alpine image
        fsGroup: 82
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: dot-env
          secret:
            secretName: env
  volumeClaimTemplates:
  - metadata:
      name: invoiceshelf-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
